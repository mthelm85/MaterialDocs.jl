name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
# TagBot pushes the release tag with GITHUB_TOKEN, which is read-only unless the
# workflow asks for more. Without contents: write every run fails with a 403 and
# the registered version is never tagged. issues: write lets it open an issue
# asking for manual help when something else goes wrong.
permissions:
  contents: write
  issues: write
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # For commits that modify workflow files: SSH key enables tagging, but
          # releases require manual creation. For full automation of such commits,
          # use a PAT with `workflow` scope instead of GITHUB_TOKEN.
          # See: https://github.com/JuliaRegistries/TagBot#commits-that-modify-workflow-files
          ssh: ${{ secrets.DOCUMENTER_KEY }}
